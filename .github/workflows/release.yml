name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          archive="rhostman-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" rhostman
          shasum -a 256 "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rhostman-${{ matrix.target }}
          path: |
            rhostman-${{ matrix.target }}.tar.gz
            rhostman-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Render formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha() { cut -d' ' -f1 "artifacts/rhostman-$1/rhostman-$1.tar.gz.sha256"; }

          sed \
            -e "s/VERSION_PLACEHOLDER/${version}/g" \
            -e "s/SHA_MACOS_ARM_PLACEHOLDER/$(sha aarch64-apple-darwin)/" \
            -e "s/SHA_MACOS_INTEL_PLACEHOLDER/$(sha x86_64-apple-darwin)/" \
            -e "s/SHA_LINUX_ARM_PLACEHOLDER/$(sha aarch64-unknown-linux-gnu)/" \
            -e "s/SHA_LINUX_INTEL_PLACEHOLDER/$(sha x86_64-unknown-linux-gnu)/" \
            homebrew/rhostman.rb.template > rhostman.rb

      - name: Push to tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TOKEN}@github.com/damjack/homebrew-rhostman.git" tap
          cp rhostman.rb tap/Formula/rhostman.rb
          cd tap
          git config user.name "rhostman-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/rhostman.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "Update rhostman to ${version}"
          git push
